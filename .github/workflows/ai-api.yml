name: ai-api

on:
  pull_request:
    paths:
      - "ai-api/**"
      - "api-spec/**"
      - ".github/workflows/ai-api.yml"
  push:
    branches: [main]
    paths:
      - "ai-api/**"
      - "api-spec/**"
      - ".github/workflows/ai-api.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ai-api
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: ai-api/requirements-test.txt
      - run: pip install -r requirements-test.txt
      - run: python -m pytest -q
        env:
          MPLCONFIGDIR: /tmp/ra-mpl
